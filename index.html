<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK BANE - Confession | Countdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0f14, #1a1a26);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            text-align: center;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        *, *::before, *::after { box-sizing: border-box; }
        .container {
            width: 100%;
            max-width: 600px;
            padding: clamp(12px, 4vw, 20px);
        }
        h1 {
            font-size: clamp(1.8rem, 8vw, 3rem);
            margin: 0 0 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h2 {
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: #8a8a9e;
            margin: 0 0 clamp(20px, 6vh, 40px);
            font-weight: 300;
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 2.5vw, 20px);
            margin-bottom: clamp(20px, 6vh, 40px);
        }
        .time-block {
            background: rgba(255, 255, 255, 0.05);
            padding: clamp(10px, 3vw, 20px) clamp(4px, 2vw, 20px);
            border-radius: 10px;
            flex: 1 1 0;
            min-width: 0;
            max-width: 120px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .number {
            font-size: clamp(1.4rem, 7vw, 2.5rem);
            font-weight: bold;
            color: #00ffcc;
            display: block;
        }
        .label {
            font-size: clamp(0.6rem, 2.5vw, 0.8rem);
            text-transform: uppercase;
            color: #8a8a9e;
            letter-spacing: 1px;
            display: block;
            overflow-wrap: anywhere;
        }
        .btn {
            display: inline-block;
            background: #00ffcc;
            color: #0f0f14;
            text-decoration: none;
            padding: clamp(12px, 3vw, 15px) clamp(24px, 7vw, 35px);
            font-size: clamp(0.95rem, 3.5vw, 1.1rem);
            font-weight: bold;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.7);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MK BANE</h1>
        <h2>Confession (Album Release)</h2>

        <div class="countdown">
            <div class="time-block">
                <span class="number" id="days">00</span>
                <span class="label">Dagar</span>
            </div>
            <div class="time-block">
                <span class="number" id="hours">00</span>
                <span class="label">Timmar</span>
            </div>
            <div class="time-block">
                <span class="number" id="minutes">00</span>
                <span class="label">Minuter</span>
            </div>
            <div class="time-block">
                <span class="number" id="seconds">00</span>
                <span class="label">Sekunder</span>
            </div>
        </div>

        <a href="https://distrokid.com" target="_blank" class="btn">Pre-Save Album</a>
    </div>

    <script>
        // Sätt måldatumet till fredagen den 13 november 2026
        const countDownDate = new Date("Nov 13, 2026 00:00:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = String(days).padStart(2, '0');
            document.getElementById("hours").innerHTML = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerHTML = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerHTML = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(x);
                document.querySelector(".countdown").innerHTML = "<h3>ALBUMET ÄR UTE NU!</h3>";
                document.querySelector(".btn").innerHTML = "Lyssna nu";
            }
        }, 1000);
    </script>
</body>
</html>
